<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

<meta charset="UTF-8">

<title>Add Password</title>

<link rel="stylesheet" th:href="@{/css/add-password.css}">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

</head>

<body>

<div class="container">

    <div class="card">

        <h2>

            <i class="fa-solid fa-key"></i>

            Add New Password

        </h2>

        <form th:action="@{/add-password}" method="post">

            <!-- Website Name -->

            <div class="input-group">

                <label>

                    Website Name

                </label>

                <input
                        type="text"
                        name="websiteName"
                        placeholder="Google"
                        required>

            </div>

            <!-- Website URL -->

            <div class="input-group">

                <label>

                    Website URL

                </label>

                <input
                        type="text"
                        name="websiteUrl"
                        placeholder="https://google.com">

            </div>

            <!-- Username -->

            <div class="input-group">

                <label>

                    Username / Email

                </label>

                <input
                        type="text"
                        name="username"
                        placeholder="abc@gmail.com"
                        required>

            </div>

            <!-- Password -->

            <div class="input-group">

                <label>

                    Password

                </label>

                <div class="password-box">

                    <input
                            type="password"
                            id="password"
                            name="password"
                            required>

                    <button
                            type="button"
                            id="togglePassword">

                        <i class="fa-solid fa-eye"></i>

                    </button>

                    <button
                            type="button"
                            id="generatePassword">

                        <i class="fa-solid fa-wand-magic-sparkles"></i>

                    </button>

                </div>

            </div>

            <!-- Category -->

            <div class="input-group">

                <label>

                    Category

                </label>

                <select name="category">

                    <option>Personal</option>

                    <option>Work</option>

                    <option>Social</option>

                    <option>Banking</option>

                    <option>Shopping</option>

                    <option>Others</option>

                </select>

            </div>

            <!-- Notes -->

            <div class="input-group">

                <label>

                    Notes

                </label>

                <textarea
                        rows="4"
                        name="notes"
                        placeholder="Optional..."></textarea>

            </div>

            <button
                    class="save-btn"
                    type="submit">

                <i class="fa-solid fa-floppy-disk"></i>

                Save Password

            </button>

        </form>

    </div>

</div>

<script>

const password =
document.getElementById("password");

document.getElementById("togglePassword")
.onclick=function(){

if(password.type==="password"){

password.type="text";

this.innerHTML="<i class='fa-solid fa-eye-slash'></i>";

}

else{

password.type="password";

this.innerHTML="<i class='fa-solid fa-eye'></i>";

}

};

document.getElementById("generatePassword")
.onclick=function(){

const chars=
"ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789@#$%&*!";

let pass="";

for(let i=0;i<14;i++){

pass+=chars.charAt(Math.floor(Math.random()*chars.length));

}

password.value=pass;

};

</script>

</body>

</html>
