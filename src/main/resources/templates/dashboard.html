<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <title>Password Vault Dashboard</title>

    <link rel="stylesheet" th:href="@{/css/dashboard.css}">

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

</head>

<body>

<!-- ================= NAVBAR ================= -->

<header class="navbar">

    <div class="logo">

        <i class="fa-solid fa-lock"></i>

        <span>PasswordVault</span>

    </div>

    <div class="profile">

        <button class="profile-btn" id="profileBtn">

            <i class="fa-solid fa-circle-user"></i>

            <span th:text="${session.fullName}"></span>

            <i class="fa-solid fa-angle-down"></i>

        </button>

        <div class="dropdown" id="profileDropdown">

            <a th:href="@{/profile}">
                <i class="fa-solid fa-user"></i>
                My Profile
            </a>

            <a href="#">
                <i class="fa-solid fa-key"></i>
                Change Password
            </a>

            <a href="#">
                <i class="fa-solid fa-gear"></i>
                Settings
            </a>

            <hr>

            <a href="/logout">
                <i class="fa-solid fa-right-from-bracket"></i>
                Logout
            </a>

        </div>

    </div>

</header>

<!-- ================= MAIN ================= -->

<div class="wrapper">

    <!-- Sidebar -->

    <aside class="sidebar">

        <a href="/dashboard" class="active">

            <i class="fa-solid fa-chart-line"></i>

            Overview

        </a>

        <a href="/passwords">

            <i class="fa-solid fa-key"></i>

            My Passwords

        </a>

        <a href="/add-password">

            <i class="fa-solid fa-plus"></i>

            Add Password

        </a>

    </aside>

    <!-- Main Content -->

    <main class="content">

        <!-- Welcome -->

        <section class="welcome">

            <h2>

                Welcome Back,

                <span th:text="${session.fullName}"></span>

                👋

            </h2>

            <p>

                Manage all your passwords securely in one place.

            </p>

        </section>

        <!-- Cards -->

        <section class="cards">

            <div class="card">

                <div class="card-icon">

                    <i class="fa-solid fa-key"></i>

                </div>

                <h1 th:text="${totalPasswords}">0</h1>

                <p>Saved Passwords</p>

            </div>

            <div class="card">

                <div class="card-icon">

                    <i class="fa-solid fa-globe"></i>

                </div>

                <h1 th:text="${totalWebsites}">0</h1>

                <p>Websites</p>

            </div>

            <div class="card">

                <div class="card-icon">

                    <i class="fa-solid fa-shield-halved"></i>

                </div>

                <h1>Strong</h1>

                <p>Security</p>

            </div>

        </section>

        <!-- Recent Passwords -->

        <section class="table-card">

            <div class="table-header">

                <h3>

                    Recent Passwords

                </h3>

            </div>

            <table>

                <thead>

                <tr>

                    <th>Website</th>

                    <th>Username</th>

                    <th>Password</th>

                    <th>Actions</th>

                </tr>

                </thead>

                <tbody>

                <!-- No Passwords -->

                <tr th:if="${#lists.isEmpty(recentPasswords)}">

                    <td colspan="4" style="text-align:center;">

                        No Passwords Added Yet

                    </td>

                </tr>

                <!-- Recent Passwords -->

                <tr th:each="password : ${recentPasswords}">

                    <td>

                        <i class="fa-solid fa-globe"></i>

                        <span th:text="${password.websiteName}"></span>

                    </td>

                    <td th:text="${password.username}"></td>

                    <td>••••••••</td>

                    <td>

                        <a th:href="@{'/view-password/' + ${password.id}}">
                            <i class="fa-solid fa-eye action view"></i>
                        </a>

                        <a th:href="@{'/edit-password/' + ${password.id}}">
                            <i class="fa-solid fa-pen action edit"></i>
                        </a>

                        <a th:href="@{'/delete-password/' + ${password.id}}"
                           onclick="return confirm('Delete this password?')">
                            <i class="fa-solid fa-trash action delete"></i>
                        </a>

                    </td>

                </tr>

                </tbody>

            </table>

        </section>

    </main>

</div>

<script>

const profileBtn = document.getElementById("profileBtn");
const dropdown = document.getElementById("profileDropdown");

profileBtn.addEventListener("click", function(e){

    e.stopPropagation();

    dropdown.classList.toggle("show");

});

document.addEventListener("click", function(){

    dropdown.classList.remove("show");

});

</script>

</body>

</html>
