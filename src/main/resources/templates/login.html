<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>Login</title>

<link rel="stylesheet" th:href="@{/css/style.css}">

</head>

<body>

<div class="container">

<h2>Password Vault Login</h2>

<p class="success" th:if="${success}" th:text="${success}"></p>

<p class="error" th:if="${error}" th:text="${error}"></p>


<form th:action="@{/login}" method="post">

<input type="email"
       name="email"
       placeholder="Enter Email"
       required>

<input type="password"
       name="password"
       placeholder="Enter Password"
       required>

<button type="submit">

Login

</button>

<p>

<a th:href="@{/forgot-password}">

Forgot Password?

</a>

</p>

</form>

<p>

Don't have an account?

<a th:href="@{/register}">

Create Account

</a>

</p>

</div>

</body>

</html>
