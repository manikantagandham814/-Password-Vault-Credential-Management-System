<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>

<meta charset="UTF-8">

<title>Register</title>

<link rel="stylesheet" th:href="@{/css/style.css}">

</head>

<body>

<div class="container">

<h2>Create Account</h2>

<p class="error"
   th:if="${error}"
   th:text="${error}">
</p>

<form th:action="@{/register}" method="post">

<input type="text"
       name="fullName"
       placeholder="Full Name"
       required>

<input type="email"
       name="email"
       placeholder="Email"
       required>

<input type="password"
       name="password"
       placeholder="Password"
       required>

<button type="submit">

Register

</button>

</form>

<p>

Already have an account?

<a th:href="@{/login}">

Login

</a>

</p>

</div>

</body>

</html>
