<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

<meta charset="UTF-8">

<title>My Passwords</title>

<link rel="stylesheet" th:href="@{/css/passwords.css}">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

</head>

<body>

<!-- ================= Navbar ================= -->

<header class="navbar">

    <div class="logo">

        <i class="fa-solid fa-lock"></i>

        PasswordVault

    </div>

    <div class="profile">

        <i class="fa-solid fa-circle-user"></i>

        <span th:text="${session.email}"></span>

    </div>

</header>

<div class="wrapper">

    <!-- ================= Sidebar ================= -->

    <aside class="sidebar">

        <a href="/dashboard">

            <i class="fa-solid fa-chart-line"></i>

            Dashboard

        </a>

        <a href="/passwords" class="active">

            <i class="fa-solid fa-key"></i>

            My Passwords

        </a>

        <a href="/add-password">

            <i class="fa-solid fa-plus"></i>

            Add Password

        </a>

    </aside>

    <!-- ================= Content ================= -->

    <main class="content">

        <div class="top-bar">

            <h2>

                My Passwords

            </h2>

            <div class="top-actions">

                <form action="/search" method="get">

                    <input
                            type="text"
                            name="keyword"
                            placeholder="Search Website...">

                    <button type="submit">

                        <i class="fa-solid fa-magnifying-glass"></i>

                    </button>

                </form>

                <a href="/add-password" class="add-btn">

                    <i class="fa-solid fa-plus"></i>

                    Add New

                </a>

            </div>

        </div>

        <table>

            <thead>

            <tr>

                <th>Website</th>

                <th>Username</th>

                <th>Category</th>

                <th>Actions</th>

            </tr>

            </thead>

            <tbody>

            <tr th:if="${#lists.isEmpty(passwords)}">

                <td colspan="4"
                    style="text-align:center;padding:40px;">

                    No Passwords Saved Yet

                </td>

            </tr>

            <tr th:each="password : ${passwords}">

                <td>

                    <i class="fa-solid fa-globe"></i>

                    <span th:text="${password.websiteName}"></span>

                </td>

                <td th:text="${password.username}"></td>

                <td>

                    <span class="category"
                          th:text="${password.category}"></span>

                </td>

                <td class="actions">

                    <!-- View -->

                    <a th:href="@{'/view-password/' + ${password.id}}"
                       title="View">

                        <i class="fa-solid fa-eye view"></i>

                    </a>

                    <!-- Edit -->

                    <a th:href="@{'/edit-password/' + ${password.id}}"
                       title="Edit">

                        <i class="fa-solid fa-pen edit"></i>

                    </a>

                    <!-- Delete -->

                    <a th:href="@{'/delete-password/' + ${password.id}}"
                       onclick="return confirm('Are you sure you want to delete this password?')"
                       title="Delete">

                        <i class="fa-solid fa-trash delete"></i>

                    </a>

                </td>

            </tr>

            </tbody>

        </table>

    </main>

</div>

</body>

</html>
